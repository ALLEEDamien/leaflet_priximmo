# Déploiement sur GitHub Pages : compile le CSS Tailwind puis publie uniquement les fichiers du site
name: Déploiement GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; un nouveau push remplace celui en cours
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Compiler le CSS
        run: |
          npm ci
          npm run build

      - name: Assembler le site
        run: |
          mkdir dist
          cp index.html dist/
          cp -r css js dist/
          rm -f dist/css/input.css

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
