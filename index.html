<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prix immobiliers en France</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <div id="searchbar" class="searchbar">
    <div class="searchbar-row">
      <svg class="searchbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="dep-search" class="searchbar-input" type="search" placeholder="Rechercher un département" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="suggestions">
      <button id="search-clear" class="searchbar-clear" type="button" aria-label="Effacer" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
  </div>

  <div class="filters" role="group" aria-label="Type de bien">
    <button class="filter-btn" type="button" data-type="all" title="Tous (appartements et maisons)" aria-label="Tous (appartements et maisons)" aria-pressed="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
    </button>
    <button class="filter-btn" type="button" data-type="appartement" title="Appartements" aria-label="Appartements" aria-pressed="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v17M15 10h3a1 1 0 0 1 1 1v10M3 21h18M9 7h2M9 11h2M9 15h2"/></svg>
    </button>
    <button class="filter-btn" type="button" data-type="maison" title="Maisons" aria-label="Maisons" aria-pressed="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5M5.5 10v10h13V10M10 20v-5h4v5"/></svg>
    </button>
    <button class="filter-btn" type="button" data-type="local" title="Locaux commerciaux" aria-label="Locaux commerciaux" aria-pressed="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0ZM5 12v8h14v-8M10 20v-4h4v4"/></svg>
    </button>
  </div>
</div>

<div class="side-stack">
  <section id="ranking" class="ranking" hidden aria-label="Classement des communes">
    <div class="ranking-head">
      <div class="min-w-0">
        <h2 class="ranking-title">Top 5 des communes</h2>
        <div id="ranking-sub" class="ranking-sub"></div>
      </div>
      <div class="ranking-sort" role="group" aria-label="Ordre du classement">
        <button class="sort-btn" type="button" data-order="asc" title="Prix croissants (les moins chères)" aria-label="Prix croissants" aria-pressed="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
        <button class="sort-btn" type="button" data-order="desc" title="Prix décroissants (les plus chères)" aria-label="Prix décroissants" aria-pressed="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
        </button>
      </div>
    </div>
    <ol id="ranking-list" class="ranking-list"></ol>
  </section>

  <aside id="panel" class="panel" hidden aria-live="polite"></aside>
</div>
<dialog id="detail" class="detail" aria-labelledby="detail-title">
  <div class="detail-card">
    <header class="detail-head">
      <div class="min-w-0">
        <h2 id="detail-title" class="detail-title"></h2>
        <div id="detail-sub" class="detail-sub"></div>
      </div>
      <button class="panel-close" type="button" data-detail-close aria-label="Fermer la fenêtre">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div id="detail-types" class="detail-types" role="group" aria-label="Type de bien"></div>
    <div id="detail-body" class="detail-body"></div>
  </div>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
